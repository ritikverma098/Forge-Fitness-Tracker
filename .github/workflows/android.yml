name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated test directories
        run: |
          echo "FORGE_TEST_PACK_DIR=$RUNNER_TEMP/forge-catalog-fixtures" >> "$GITHUB_ENV"
          echo "FORGE_TEST_TMP=$RUNNER_TEMP/forge-tests" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: disabled
          validate-wrappers: true

      - name: Install required Android SDK packages
        run: |
          # yes exits on a closed pipe; only sdkmanager's status controls this check.
          set +e
          yes | sdkmanager --licenses > /dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          test "$license_status" -eq 0
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Fetch pinned catalog test fixtures
        run: |
          mkdir -p "$FORGE_TEST_PACK_DIR"
          base='https://github.com/ritikverma098/Forge-Fitness-Tracker/releases/download/v1.4.0'
          for asset in \
            forge-india-packaged-1.0.0.forgefoods \
            forge-india-packaged-1.0.0.forgefoods.report.json \
            forge-usda-branded-1.0.0.forgefoods \
            forge-usda-branded-1.0.0.forgefoods.report.json; do
            curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --max-time 300 --retry 3 \
              "$base/$asset" --output "$FORGE_TEST_PACK_DIR/$asset"
          done
          cd "$FORGE_TEST_PACK_DIR"
          sha256sum --check <<'CHECKSUMS'
          7fc1b291170f04b2ce9e2a59625b6152fb6c992dc0e3dc12dc4b19a039073aa3  forge-india-packaged-1.0.0.forgefoods
          979b7f24cf87c051736a8ee0b3d97c501ee0262259dff33150367d5635b2b431  forge-india-packaged-1.0.0.forgefoods.report.json
          a99b80dd947ab91dae31f81b983295f655f629d75b3155b3fb3257242d01bcb1  forge-usda-branded-1.0.0.forgefoods
          b2efd9f7515d93600dc7d1e161ce4412613d9e6f4403a2b912bac3e77bd8c2da  forge-usda-branded-1.0.0.forgefoods.report.json
          CHECKSUMS

      - name: Test catalog importers
        run: python -m unittest discover -s tools/catalog -p 'test_*.py'

      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 --continue -Pforge.allowUnsignedRelease=true \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
